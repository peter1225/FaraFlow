name: faraflow

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: faraflow
      POSTGRES_USER: faraflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faraflow -d faraflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [control]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-faraflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-in-production}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [control]

  temporal:
    image: temporalio/auto-setup:1.27
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: faraflow
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    networks: [control]

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8088:8080"
    networks: [control]

  api:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FARAFLOW_ENVIRONMENT: production
      FARAFLOW_DATABASE_URL: postgresql+asyncpg://faraflow:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/faraflow
      FARAFLOW_ARTIFACT_ROOT: /app/artifacts
      FARAFLOW_BROWSER_STATE_ROOT: /app/browser-state
      FARAFLOW_FARA_BASE_URL: ${FARAFLOW_FARA_BASE_URL:-http://host.docker.internal:5000/v1}
      FARAFLOW_FARA_API_KEY: ${FARAFLOW_FARA_API_KEY:-not-needed}
      FARAFLOW_FARA_MODEL: ${FARAFLOW_FARA_MODEL:-microsoft/Fara1.5-9B}
      FARAFLOW_BROWSER_HEADLESS: "true"
      FARAFLOW_MAX_CONCURRENT_SESSIONS: ${FARAFLOW_MAX_CONCURRENT_SESSIONS:-2}
      FARAFLOW_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - artifact-data:/app/artifacts
      - browser-state:/app/browser-state
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    shm_size: 2gb
    networks: [control, execution]

  console:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "3000:80"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    networks: [control]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  artifact-data:
  browser-state:

networks:
  control:
    internal: true
  execution:

